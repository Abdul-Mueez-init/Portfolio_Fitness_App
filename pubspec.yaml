name: my_first_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.8.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  flutter_svg: ^2.3.0
  smooth_page_indicator: ^2.0.1
  lottie: ^3.5.1
  animate_do: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/animations/
    - assets/fonts/

  # Uncomment after adding fonts
